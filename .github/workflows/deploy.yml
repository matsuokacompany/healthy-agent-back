name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      # Keep the deploy independent from Marketplace action downloads. This is
      # equivalent to actions/checkout for the exact commit that triggered it.
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git init .
          git remote add origin "https://github.com/$REPOSITORY.git"
          for attempt in 1 2 3; do
            if git -c http.extraheader="$auth_header" fetch --no-tags --depth=1 origin "$REVISION"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          git checkout --detach FETCH_HEAD

      # Building here (GitHub's runner) instead of on the EC2 instance is the
      # whole point of this step: the production box is small enough that a
      # local `docker build` (gcc, pip install, etc.) has previously eaten
      # all its RAM and taken the instance down. The runner has plenty of
      # both, and the image only needs to be pulled on EC2, not built there.
      - name: Build and push image to GHCR
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST"
          test -n "$EC2_HOST_KEY"
          test -n "$EC2_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy

          # Preserve the trusted key but bind it to the exact hostname used by
          # scp. This also handles a key collected using the instance IP while
          # EC2_HOST contains its DNS name (or the inverse).
          printf '%s\n' "$EC2_HOST_KEY" | tr -d '\r' | awk -v host="$EC2_HOST" '
            NF >= 3 && $1 !~ /^#/ { print host, $(NF - 1), $NF }
          ' > ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "EC2_HOST_KEY must contain the complete output of: ssh-keyscan -H $EC2_HOST" >&2
            exit 1
          fi
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config
          ssh-keygen -F "$EC2_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Build deployment bundle
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_ENV"
          test -n "$GHCR_PULL_TOKEN"
          printf '%s\n' "$PRODUCTION_ENV" > /tmp/healthy-agent.env
          chmod 600 /tmp/healthy-agent.env
          printf '%s' "$GHCR_PULL_TOKEN" > /tmp/ghcr-pull-token
          chmod 600 /tmp/ghcr-pull-token
          cp docker-compose.yml /tmp/docker-compose.yml

      - name: Upload release to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          if ! ssh -o ConnectTimeout=15 "$EC2_USER@$EC2_HOST" true; then
            echo "SSH connection failed. Confirm that EC2_HOST_KEY belongs to EC2_HOST and that port 22 is allowed." >&2
            exit 1
          fi
          scp /tmp/docker-compose.yml /tmp/healthy-agent.env /tmp/ghcr-pull-token \
            "$EC2_USER@$EC2_HOST:/tmp/"

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          ssh "$EC2_USER@$EC2_HOST" 'bash -se' <<'EOF'
            set -euo pipefail

            command -v docker >/dev/null || {
              echo "Docker is not installed on the EC2 instance." >&2
              exit 1
            }
            docker compose version >/dev/null

            app_dir="$HOME/healthy-agent-back"
            mkdir -p "$app_dir"

            install -m 644 /tmp/docker-compose.yml "$app_dir/docker-compose.yml"
            install -m 600 /tmp/healthy-agent.env "$app_dir/.env"
            ghcr_token=$(cat /tmp/ghcr-pull-token)
            rm -f /tmp/docker-compose.yml /tmp/healthy-agent.env /tmp/ghcr-pull-token

            cd "$app_dir"
            # The image is built and pushed by the workflow's own "Build and
            # push image to GHCR" step -- never build here. This instance has
            # previously run out of memory doing that build locally.
            echo "$ghcr_token" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans

            # Migrations run in the image CMD. Fail the deployment if the API exits.
            healthy_checks=0
            for attempt in $(seq 1 12); do
              if [ -n "$(docker compose ps --status running --quiet api)" ]; then
                healthy_checks=$((healthy_checks + 1))
                if [ "$healthy_checks" -ge 3 ]; then
                  docker image prune -f
                  exit 0
                fi
              else
                healthy_checks=0
              fi
              sleep 5
            done

            docker compose logs --no-color --tail=100 api
            exit 1
          EOF
