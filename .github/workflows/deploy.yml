name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      # SSH to the instance tunnels through AWS Systems Manager instead of a
      # direct TCP connection, so port 22 never needs to be open to the
      # internet -- these credentials only need ssm:StartSession on the one
      # instance below, nothing broader. The instance ID is stable for the
      # life of the box (unlike its public IP), so it's safe to commit here.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EC2_INSTANCE_ID: i-07feed649da182801

    steps:
      # Keep the deploy independent from Marketplace action downloads. This is
      # equivalent to actions/checkout for the exact commit that triggered it.
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git init .
          git remote add origin "https://github.com/$REPOSITORY.git"
          for attempt in 1 2 3; do
            if git -c http.extraheader="$auth_header" fetch --no-tags --depth=1 origin "$REVISION"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          git checkout --detach FETCH_HEAD

      # Building here (GitHub's runner) instead of on the EC2 instance is the
      # whole point of this step: the production box is small enough that a
      # local `docker build` (gcc, pip install, etc.) has previously eaten
      # all its RAM and taken the instance down. The runner has plenty of
      # both, and the image only needs to be pulled on EC2, not built there.
      - name: Build and push image to GHCR
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      # The AWS CLI ships preinstalled on ubuntu-latest; the Session Manager
      # plugin doesn't, and it's an AWS-provided binary (not a Marketplace
      # action), fetched directly from AWS's own distribution bucket.
      - name: Install SSM Session Manager plugin
        run: |
          set -euo pipefail
          curl -sS "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version
          aws --version

      - name: Configure SSH over SSM
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # No known_hosts pinning here: the connection never touches the
          # open network, it's tunneled through the SSM agent's own
          # authenticated channel to this exact instance ID, so there's no
          # position from which the host key could be spoofed the way a
          # direct TCP connection could be.
          cat > ~/.ssh/config <<EOF
          Host ec2-deploy-target
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyCommand aws ssm start-session --target $EC2_INSTANCE_ID --document-name AWS-StartSSHSession --parameters portNumber=%p --region $AWS_REGION
          EOF
          chmod 600 ~/.ssh/config

      - name: Build deployment bundle
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_ENV"
          test -n "$GHCR_PULL_TOKEN"
          printf '%s\n' "$PRODUCTION_ENV" > /tmp/healthy-agent.env
          chmod 600 /tmp/healthy-agent.env
          printf '%s' "$GHCR_PULL_TOKEN" > /tmp/ghcr-pull-token
          chmod 600 /tmp/ghcr-pull-token
          cp docker-compose.yml /tmp/docker-compose.yml

      - name: Upload release to EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          test -n "$EC2_USER"
          if ! ssh -o ConnectTimeout=15 "$EC2_USER@ec2-deploy-target" true; then
            echo "SSM tunnel failed. Confirm: the instance's Ping status is Online in Systems Manager > Fleet Manager; the IAM user behind AWS_ACCESS_KEY_ID has ssm:StartSession on $EC2_INSTANCE_ID; and EC2_INSTANCE_ID/AWS_REGION above still match the instance." >&2
            exit 1
          fi
          scp /tmp/docker-compose.yml /tmp/healthy-agent.env /tmp/ghcr-pull-token \
            "$EC2_USER@ec2-deploy-target:/tmp/"

      - name: Deploy on EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          ssh "$EC2_USER@ec2-deploy-target" 'bash -se' <<'EOF'
            set -euo pipefail

            command -v docker >/dev/null || {
              echo "Docker is not installed on the EC2 instance." >&2
              exit 1
            }
            docker compose version >/dev/null

            app_dir="$HOME/healthy-agent-back"
            mkdir -p "$app_dir"

            install -m 644 /tmp/docker-compose.yml "$app_dir/docker-compose.yml"
            install -m 600 /tmp/healthy-agent.env "$app_dir/.env"
            ghcr_token=$(cat /tmp/ghcr-pull-token)
            rm -f /tmp/docker-compose.yml /tmp/healthy-agent.env /tmp/ghcr-pull-token

            cd "$app_dir"
            # The image is built and pushed by the workflow's own "Build and
            # push image to GHCR" step -- never build here. This instance has
            # previously run out of memory doing that build locally.
            echo "$ghcr_token" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans

            # Migrations run in the image CMD. Fail the deployment if the API exits.
            healthy_checks=0
            for attempt in $(seq 1 12); do
              if [ -n "$(docker compose ps --status running --quiet api)" ]; then
                healthy_checks=$((healthy_checks + 1))
                if [ "$healthy_checks" -ge 3 ]; then
                  docker image prune -f
                  exit 0
                fi
              else
                healthy_checks=0
              fi
              sleep 5
            done

            docker compose logs --no-color --tail=100 api
            exit 1
          EOF
